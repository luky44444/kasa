<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3efe6" />
    <title>Kasa</title>
    <script>
      (function () {
        try {
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/icon.svg" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main class="login">
      <form id="gateForm" autocomplete="on">
        <h1>Kasa</h1>
        <p id="blurb">Loading…</p>
        <p class="error hidden" id="error"></p>
        <div class="field" id="emailWrap">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" />
        </div>
        <div class="field" id="passwordWrap">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="10" maxlength="128" />
        </div>
        <div class="field hidden" id="confirmWrap">
          <label for="confirm">Confirm password</label>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="10" maxlength="128" />
        </div>
        <div class="field hidden" id="pinWrap">
          <label for="pin">PIN</label>
          <input id="pin" name="pin" type="password" inputmode="numeric" pattern="\d{4,6}" maxlength="6" autocomplete="off" />
        </div>
        <div class="field hidden" id="pinConfirmWrap">
          <label for="pinConfirm">PIN again</label>
          <input id="pinConfirm" name="pinConfirm" type="password" inputmode="numeric" pattern="\d{4,6}" maxlength="6" autocomplete="off" />
        </div>
        <p class="login-hint" id="hint"></p>
        <button type="submit" id="submitBtn">Continue</button>
      </form>
    </main>
    <script>
      const errorEl = document.getElementById("error");
      const blurb = document.getElementById("blurb");
      const hint = document.getElementById("hint");
      const submitBtn = document.getElementById("submitBtn");
      const emailWrap = document.getElementById("emailWrap");
      const passwordWrap = document.getElementById("passwordWrap");
      const confirmWrap = document.getElementById("confirmWrap");
      const pinWrap = document.getElementById("pinWrap");
      const pinConfirmWrap = document.getElementById("pinConfirmWrap");
      const email = document.getElementById("email");
      const password = document.getElementById("password");
      const confirm = document.getElementById("confirm");
      const pin = document.getElementById("pin");
      const pinConfirm = document.getElementById("pinConfirm");
      let mode = "login";

      function show(el, on) {
        el.classList.toggle("hidden", !on);
      }

      function showError(message) {
        errorEl.textContent = message;
        errorEl.classList.remove("hidden");
      }

      function setMode(data) {
        if (data.unlocked) {
          location.href = "/";
          return;
        }
        if (data.needsUpgrade || !data.registered) mode = "register";
        else if (!data.loggedIn) mode = "login";
        else if (!data.hasPin) mode = "setpin";
        else mode = "unlock";

        show(emailWrap, mode === "register" || mode === "login");
        show(passwordWrap, mode === "register" || mode === "login");
        show(confirmWrap, mode === "register");
        show(pinWrap, mode === "setpin" || mode === "unlock");
        show(pinConfirmWrap, mode === "setpin");
        email.required = mode === "register" || mode === "login";
        password.required = mode === "register" || mode === "login";
        confirm.required = mode === "register";
        pin.required = mode === "setpin" || mode === "unlock";
        pinConfirm.required = mode === "setpin";

        if (mode === "register") {
          blurb.textContent = data.needsUpgrade
            ? "Your PIN is saved. Create the email login so the app can remember you."
            : "Create your account first. After that, you will set a PIN as a second lock.";
          hint.textContent = "Password at least 10 characters. Hashed on the server.";
          submitBtn.textContent = "Create account";
          password.autocomplete = "new-password";
        } else if (mode === "login") {
          blurb.textContent = "Log in. This stays signed in on this browser.";
          hint.textContent = "";
          submitBtn.textContent = "Log in";
          password.autocomplete = "current-password";
        } else if (mode === "setpin") {
          blurb.textContent = "Now create a PIN. Login stays remembered; the PIN locks the ledger.";
          hint.textContent = "4–6 digits. Asked every time you open Kasa, and after 5 minutes idle.";
          submitBtn.textContent = "Create PIN";
        } else {
          blurb.textContent = "Enter your PIN to open the ledger.";
          hint.textContent = "You are still logged in. The PIN is the second lock.";
          submitBtn.textContent = "Unlock";
        }
      }

      fetch("/api/auth")
        .then((response) => response.json())
        .then(setMode)
        .catch(() => setMode({ registered: location.pathname !== "/register", loggedIn: false, hasPin: false, unlocked: false }));

      document.getElementById("gateForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        errorEl.classList.add("hidden");
        if (mode === "register" && password.value !== confirm.value) {
          showError("Passwords do not match.");
          return;
        }
        if (mode === "setpin" && pin.value !== pinConfirm.value) {
          showError("PINs do not match.");
          return;
        }
        submitBtn.disabled = true;
        try {
          let path = "/api/login";
          let body = { email: email.value, password: password.value };
          if (mode === "register") path = "/api/register";
          if (mode === "setpin") {
            path = "/api/pin";
            body = { pin: pin.value };
          }
          if (mode === "unlock") {
            path = "/api/unlock";
            body = { pin: pin.value };
          }
          const response = await fetch(path, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(body),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            showError(data.error || "Could not continue.");
            return;
          }
          location.href = mode === "setpin" || mode === "unlock" ? "/" : "/pin";
        } catch {
          showError("Could not continue.");
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
