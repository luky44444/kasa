<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3efe6" />
    <title>Kasa</title>
    <script>
      (function () {
        try {
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/icon.svg" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main class="login">
      <form id="gateForm" autocomplete="on">
        <h1>Kasa</h1>
        <p id="blurb">Loading…</p>
        <p class="error hidden" id="error"></p>
        <div class="field" id="emailWrap">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" />
        </div>
        <div class="field" id="passwordWrap">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" />
        </div>
        <div class="field hidden" id="confirmWrap">
          <label for="confirm">Confirm password</label>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="10" maxlength="128" />
        </div>
        <div class="field hidden" id="pinWrap">
          <label for="pin">PIN</label>
          <input id="pin" name="pin" type="password" inputmode="numeric" pattern="\d{4,6}" maxlength="6" autocomplete="off" />
        </div>
        <p class="login-hint" id="hint"></p>
        <button type="submit" id="submitBtn">Continue</button>
        <a class="login-switch hidden" id="switchAuth" href="/login">Use email and password</a>
      </form>
    </main>
    <script>
      const errorEl = document.getElementById("error");
      const blurb = document.getElementById("blurb");
      const hint = document.getElementById("hint");
      const submitBtn = document.getElementById("submitBtn");
      const emailWrap = document.getElementById("emailWrap");
      const passwordWrap = document.getElementById("passwordWrap");
      const confirmWrap = document.getElementById("confirmWrap");
      const pinWrap = document.getElementById("pinWrap");
      const email = document.getElementById("email");
      const password = document.getElementById("password");
      const confirm = document.getElementById("confirm");
      const pin = document.getElementById("pin");
      const switchAuth = document.getElementById("switchAuth");
      let mode = "login";
      let pinAvailable = false;

      function show(el, on) {
        el.classList.toggle("hidden", !on);
      }

      function showError(message) {
        errorEl.textContent = message;
        errorEl.classList.remove("hidden");
      }

      function wantsEmailLogin() {
        return location.pathname === "/login" || location.pathname === "/login.html";
      }

      function setMode(data) {
        if (data.loggedIn && (!data.hasPin || data.unlocked)) {
          location.href = "/";
          return;
        }
        pinAvailable = Boolean(data.loggedIn && data.hasPin && !data.unlocked);
        if (!data.registered) mode = "register";
        else if (!data.loggedIn) mode = "login";
        else if (wantsEmailLogin()) mode = "login";
        else mode = "unlock";

        show(emailWrap, mode !== "unlock");
        show(passwordWrap, mode !== "unlock");
        show(confirmWrap, mode === "register");
        show(pinWrap, mode === "unlock");
        email.required = mode !== "unlock";
        password.required = mode !== "unlock";
        confirm.required = mode === "register";
        pin.required = mode === "unlock";

        if (mode === "register") {
          blurb.textContent = "Create your account. This is a one-time setup.";
          hint.textContent = "Password at least 10 characters. Hashed on the server. After this you will only see Log in.";
          submitBtn.textContent = "Create account";
          password.autocomplete = "new-password";
          password.minLength = 10;
        } else if (mode === "login") {
          blurb.textContent = pinAvailable
            ? "Log in with email and password."
            : "Log in. This stays signed in on this browser.";
          hint.textContent = pinAvailable
            ? "This also opens the ledger if you would rather not use the PIN."
            : "Wrong password is rate-limited. There is no second register.";
          submitBtn.textContent = "Log in";
          password.autocomplete = "current-password";
          password.removeAttribute("minlength");
        } else {
          blurb.textContent = "Enter your PIN to open the ledger.";
          hint.textContent = "You are still logged in. The PIN is an extra lock.";
          submitBtn.textContent = "Unlock";
        }

        if (mode === "unlock") {
          switchAuth.href = "/login";
          switchAuth.textContent = "Use email and password";
          show(switchAuth, true);
        } else if (mode === "login" && pinAvailable) {
          switchAuth.href = "/pin";
          switchAuth.textContent = "Use PIN instead";
          show(switchAuth, true);
        } else {
          show(switchAuth, false);
        }
      }

      fetch("/api/auth")
        .then((response) => response.json())
        .then(setMode)
        .catch(() => setMode({ registered: location.pathname !== "/register", loggedIn: false, hasPin: false, unlocked: false }));

      document.getElementById("gateForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        errorEl.classList.add("hidden");
        if (mode === "register" && password.value !== confirm.value) {
          showError("Passwords do not match.");
          return;
        }
        submitBtn.disabled = true;
        try {
          let path = "/api/login";
          let body = { email: email.value, password: password.value };
          if (mode === "register") path = "/api/register";
          if (mode === "unlock") {
            path = "/api/unlock";
            body = { pin: pin.value };
          }
          const response = await fetch(path, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(body),
          });
          const data = await response.json().catch(() => ({}));
          if (response.status === 409) {
            showError(data.error || "An account already exists. Log in instead.");
            setMode({ registered: true, loggedIn: false, hasPin: false, unlocked: false });
            return;
          }
          if (!response.ok) {
            showError(data.error || "Could not continue.");
            return;
          }
          location.href = "/";
        } catch {
          showError("Could not continue.");
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
