<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3efe6" />
    <title>Kasa</title>
    <script>
      (function () {
        try {
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/icon.svg" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main class="login">
      <form id="gateForm" autocomplete="off">
        <h1>Kasa</h1>
        <p id="blurb">Loading…</p>
        <p class="error hidden" id="error"></p>
        <div class="field">
          <label for="pin">PIN</label>
          <input id="pin" name="pin" type="password" inputmode="numeric" pattern="\d{4,6}" maxlength="6" autocomplete="off" required />
        </div>
        <div class="field hidden" id="confirmWrap">
          <label for="confirm">PIN again</label>
          <input id="confirm" name="confirm" type="password" inputmode="numeric" pattern="\d{4,6}" maxlength="6" autocomplete="off" />
        </div>
        <p class="login-hint" id="hint"></p>
        <button type="submit" id="submitBtn">Continue</button>
      </form>
    </main>
    <script>
      const errorEl = document.getElementById("error");
      const blurb = document.getElementById("blurb");
      const hint = document.getElementById("hint");
      const submitBtn = document.getElementById("submitBtn");
      const pin = document.getElementById("pin");
      const confirmWrap = document.getElementById("confirmWrap");
      const confirm = document.getElementById("confirm");
      let mode = "login";

      function showError(message) {
        errorEl.textContent = message;
        errorEl.classList.remove("hidden");
      }

      function setMode(registered) {
        mode = registered ? "login" : "register";
        if (mode === "login") {
          blurb.textContent = "Enter your PIN. Needed every time you open Kasa, and after 5 minutes idle.";
          hint.textContent = "";
          submitBtn.textContent = "Unlock";
          pin.maxLength = 128;
          confirmWrap.classList.add("hidden");
          confirm.required = false;
          return;
        }
        blurb.textContent = "Choose a PIN first. Only one PIN can be set. Nobody else can register after you.";
        hint.textContent = "4–6 digits. Hashed on the server, never stored in plain text.";
        submitBtn.textContent = "Create PIN";
        pin.maxLength = 6;
        confirmWrap.classList.remove("hidden");
        confirm.required = true;
      }

      fetch("/api/auth")
        .then((response) => response.json())
        .then((data) => setMode(Boolean(data.registered)))
        .catch(() => setMode(location.pathname !== "/register"));

      document.getElementById("gateForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        errorEl.classList.add("hidden");
        const value = pin.value.trim();
        if (mode === "register" && value !== confirm.value.trim()) {
          showError("PINs do not match.");
          return;
        }
        submitBtn.disabled = true;
        try {
          const response = await fetch(mode === "register" ? "/api/register" : "/api/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ pin: value }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            showError(data.error || "Could not continue.");
            return;
          }
          location.href = "/";
        } catch {
          showError("Could not continue.");
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
